name: 21 Build ImmortalWrt 25.12 PVE (Manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "build = 生成固件；configure = 仅检查依赖及配置，不生成固件"
        type: choice
        options: [build, configure]
        default: build
      publish_release:
        description: "编译成功后保存到 GitHub Releases（始终保留旧版本）"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: immortalwrt-25-pve-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TZ: Asia/Shanghai
  BUILD_DIR: /mnt/immortalwrt-25-pve
  FORCE_UNSAFE_CONFIGURE: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare hosted runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl ca-certificates \
            subversion time patch pkg-config libelf-dev xsltproc \
            bzip2 gzip xz-utils zstd cpio bc genisoimage qemu-utils
          sudo install -d -o "$USER" -g "$(id -gn)" "$BUILD_DIR"
          df -h / /mnt

      - name: Fetch locked release, feeds and Bandix
        run: python3 immortalwrt-25.12/scripts/prepare.py "$BUILD_DIR"

      - name: Resolve and check configuration
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          ./scripts/feeds update -a 2>&1 | tee feeds-update.log
          ./scripts/feeds install -a -p packages 2>&1 | tee feeds-install.log
          python3 "$GITHUB_WORKSPACE/immortalwrt-25.12/scripts/configure.py" "$BUILD_DIR" \
            2>&1 | tee -a feeds-install.log
          make defconfig 2>&1 | tee defconfig.log
          if grep -q 'recursive dependency detected' defconfig.log; then exit 1; fi
          python3 "$GITHUB_WORKSPACE/immortalwrt-25.12/scripts/verify_config.py" \
            "$GITHUB_WORKSPACE/immortalwrt-25.12/config.seed" .config
          ./scripts/diffconfig.sh > config.buildinfo

      - name: Download sources
        if: inputs.operation == 'build'
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          make download -j8 2>&1 | tee download.log

      - name: Build firmware
        if: inputs.operation == 'build'
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          # Keep memory available for Rust, Go and the BTF linker.
          make -j2 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee build-retry.log

      - name: Collect verified images and build record
        if: inputs.operation == 'build'
        run: |
          python3 immortalwrt-25.12/scripts/collect.py "$BUILD_DIR" "$GITHUB_WORKSPACE/firmware"

      - name: Upload firmware
        if: success() && inputs.operation == 'build'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: immortalwrt-25.12.2-pve-${{ github.run_number }}-${{ github.run_attempt }}
          path: firmware/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Save configuration and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: immortalwrt-25.12-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            /mnt/immortalwrt-25-pve/*.log
            /mnt/immortalwrt-25-pve/.config
            /mnt/immortalwrt-25-pve/config.buildinfo
            /mnt/immortalwrt-25-pve/build-lock.json
            /mnt/immortalwrt-25-pve/logs/
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true

  release:
    needs: build
    if: inputs.operation == 'build' && inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: immortalwrt-25.12.2-pve-${{ github.run_number }}-${{ github.run_attempt }}
          path: firmware
      - name: Publish this manual build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          tag="immortalwrt-25.12.2-pve-$BUILD_NUMBER-$BUILD_ATTEMPT"
          gh release create "$tag" firmware/* \
            --target "$SOURCE_COMMIT" \
            --title "ImmortalWrt 25.12.2 PVE · $BUILD_NUMBER-$BUILD_ATTEMPT" \
            --notes-file firmware/BUILD-INFO.md \
            --latest=false
